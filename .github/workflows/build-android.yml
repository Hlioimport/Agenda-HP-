name: Build Agenda HP APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          mkdir app
          unzip -q agenda-hp-publico-sanitizado.zip -d app
          test -f app/package.json

      - name: Gerar assets e projeto Android
        run: |
          cd app
          npm install --no-audit --no-fund
          npm run assets:generate
          npx cap add android
          npx cap sync android

      - name: Compilar APK de teste
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-HP-APK-de-teste
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
